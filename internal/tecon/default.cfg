# ==============================================================================
#  tecon.cfg — Tor Extended CONfig: единый файл настроек tor-connect
# ==============================================================================
#  Это обычный файл настроек Tor (torrc), расширенный директивами tor-connect.
#  Любая строка, которая не является директивой tor-connect, передаётся Tor как
#  есть, поэтому подойдёт любой готовый torrc: достаточно назвать его tecon.cfg.
#
#  Комментарий начинается с «#» в начале строки или после пробела.
#  Относительные пути (DataDirectory, HiddenServiceDir и др.) считаются от папки
#  этого файла.
#
#  Где ищется файл (имена по порядку: tecon.cfg, tecon):
#    1. рядом с tor-connect.exe;
#    2. в рабочей папке (откуда запущена программа).
#  Файл рядом с программой приоритетнее и полностью перекрывает файл из рабочей
#  папки (настройки не объединяются). Если файла нет нигде, создаётся этот.
#  Указать файл явно можно так:  tor-connect.exe -f путь\к\файлу
#
#  Файл перечитывается на лету: сохранили, и изменения применились. Если
#  настройку нельзя поменять без перезапуска (например, DataDirectory),
#  программа сообщит об этом. При ошибке в новом файле продолжают действовать
#  прежние настройки.
#
#  Занятые порты: если порт, который слушает Tor (SocksPort, DNSPort,
#  HTTPTunnelPort...) или проброс (MapPort), занят другой программой, эта
#  строка пропускается с сообщением, а программа продолжает работать. Занятые
#  порты проверяются заново каждые 30 секунд.
# ==============================================================================

# ------------------------------------------------------------------------------
#  1. Входящий прокси (SOCKS5) для ваших программ и общие параметры Tor
# ------------------------------------------------------------------------------
# Локальный SOCKS5-прокси. Адрес 127.0.0.1 означает «только этот компьютер».
SocksPort 127.0.0.1:9050

# Журнал в окно программы (уровни: notice, info, debug). В файл:
# Log notice file D:\tor\tor.log
Log notice stdout

# Каталог данных Tor. По умолчанию это папка data рядом с программой.
#DataDirectory D:\tor\data

# Страна выхода (нужны файлы GeoIP, их будет скачивать команда -geo-update):
#ExitNodes {de},{nl}
#StrictNodes 1

# DNS через Tor. 127.0.0.1:53 — только этот компьютер; 0.0.0.0:53 — для всей сети
# (компьютер станет DNS-сервером через Tor для сети, включайте только в доверенной).
# AutomapHosts* выдают для .onion-имён виртуальные адреса 10.192.x.x. На Windows у Tor
# нет TransPort, поэтому такие адреса работают только в программах, которые подключаются
# через SOCKS5 по этому IP; обычным программам без поддержки SOCKS они не помогут.
#DNSPort 127.0.0.1:53
#AutomapHostsOnResolve 1
#AutomapHostsSuffixes .onion

# ------------------------------------------------------------------------------
#  2. Onion-службы: доступ к вашим службам из сети Tor
# ------------------------------------------------------------------------------
# Каждая строка HiddenServiceDir создаёт отдельную onion-службу со своим адресом
# (адрес лежит в файле hostname этой папки, а программа ещё и пишет его в журнал).
# Строки HiddenServicePort после неё относятся к этой службе:
#   HiddenServicePort порт-в-onion [адрес:порт-у-вас]
# Без второго параметра пересылка идёт на 127.0.0.1 и тот же порт. Строк HiddenServicePort
# может быть сколько угодно: одна служба, один адрес, несколько портов.
# Версия адреса только v3, строку HiddenServiceVersion 3 можно не писать.
# Раскомментируйте HiddenServiceDir вместе с его HiddenServicePort: порты без каталога службы
# Tor не принимает (такие строки tor-connect пропускает с предупреждением).
# Осторожно: любой, кто узнает onion-адрес, сможет обращаться к этим портам (например, к RDP
# или SSH). Защитите службы паролями или авторизацией клиентов (папка authorized_clients
# внутри HiddenServiceDir, файлы *.auth). FTP (порт 21) через одну onion-службу работает
# только в активном режиме: для пассивного нужны ещё и порты данных.
#HiddenServiceDir hs/main
#HiddenServicePort 21 127.0.0.1:21
#HiddenServicePort 22 127.0.0.1:22
#HiddenServicePort 80 127.0.0.1:8080
#HiddenServicePort 3389 127.0.0.1:1805
# Вторая служба, второй адрес:
#HiddenServiceDir hs/web
#HiddenServicePort 80 127.0.0.1:8081

# ------------------------------------------------------------------------------
#  3. Вышестоящие прокси для самого Tor (необязательно)
# ------------------------------------------------------------------------------
# Tor выходит в интернет через эти прокси. Строк может быть несколько: варианты
# перебираются по порядку, последний рабочий пробуется первым, а сбойный на время
# уходит в конец очереди. «direct» означает прямое подключение без прокси.
# Форматы: direct | socks5://[логин:пароль@]хост:порт | http://[логин:пароль@]хост:порт
# Спецсимволы в логине и пароле пишутся так: @ = %40, # = %23, : = %3A, / = %2F.
# Ключ командной строки -upstream заменяет все строки Upstream из этого файла.
#Upstream direct
#Upstream socks5://user:pass@10.0.0.1:1080
#Upstream http://user:pass@10.0.0.2:8080

# ------------------------------------------------------------------------------
#  4. Проброс портов: MapPort (TCP) и MapPortUDP (UDP)
# ------------------------------------------------------------------------------
# Слушает порт на этом компьютере и пересылает подключения на другой адрес:
#   MapPort [адрес:]порт to [хост:]порт [via tor|direct|upstream]
# Слева только порт: слушать на всех интерфейсах (0.0.0.0), иначе указанный адрес.
# Справа только порт: локальный порт этого компьютера (127.0.0.1), иначе хост:порт
# (хостом может быть и адрес .onion).
# via: tor (через Tor), direct (напрямую), upstream (через вышестоящие прокси Upstream).
# Без via: .onion и внешние адреса идут через tor, локальные и частные (127.*, 10.*,
# 192.168.*) напрямую. Через Tor нельзя подключаться к локальным адресам.
#MapPort 127.0.0.1:122 to 155.33.11.22:22
#MapPort 127.0.0.1:555 to 125
#MapPort 143 to 144.33.44.17:1146
# UDP идёт только напрямую (Tor и onion-службы не переносят UDP):
#MapPortUDP 127.0.0.1:122 to 155.33.11.22:22
#MapPortUDP 143 to 144.33.44.17:1146
# Чтобы проброшенный порт был доступен и через onion-адрес, направьте на него
# onion-службу (внутри блока HiddenServiceDir, см. раздел 2):
#HiddenServicePort 122 127.0.0.1:122

# ------------------------------------------------------------------------------
#  5. Мосты (если Tor блокируют)
# ------------------------------------------------------------------------------
# Сейчас поддерживаются обычные мосты без транспорта (IP:порт ОТПЕЧАТОК).
# Транспорты obfs4 и webtunnel, а также перебор и проверка мостов в разработке.
#UseBridges 1
#Bridge 203.0.113.10:443 0123456789ABCDEF0123456789ABCDEF01234567
