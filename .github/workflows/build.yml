name: build-win

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build-win-deps.sh"
      - "scripts/versions.env"
      - "cmd/**"
      - "go.mod"
      - "internal/**"
      - "assets/**"
      - "README.md"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Go 1.20 — последняя версия, поддерживающая Windows 7 / Server 2008 R2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.20.14"
          cache: false

      - name: Unit tests (pure Go)
        run: go test ./internal/...

      - name: Install mingw-w64 (win32 threads, msvcrt)
        timeout-minutes: 10
        run: |
          # зеркало Ubuntu иногда зависает: повторные попытки и ограничение времени на каждую
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update &&
               sudo timeout 400 apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends mingw-w64 make perl curl ca-certificates binutils-mingw-w64-x86-64; then
              break
            fi
            echo "попытка $attempt не удалась"; [ "$attempt" = 3 ] && exit 1; sleep 10
          done
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-win32
          x86_64-w64-mingw32-gcc -v 2>&1 | tail -n 3

      - name: Restore deps cache
        id: depscache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build
          key: deps-${{ hashFiles('scripts/versions.env', 'scripts/build-win-deps.sh') }}

      - name: Build zlib, libevent, OpenSSL, Tor (static)
        if: steps.depscache.outputs.cache-hit != 'true'
        run: bash scripts/build-win-deps.sh

      - name: Save deps cache
        if: steps.depscache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: build
          key: deps-${{ hashFiles('scripts/versions.env', 'scripts/build-win-deps.sh') }}

      - name: Compile Windows resources (icon, manifest, version info)
        run: |
          x86_64-w64-mingw32-windres -O coff -i cmd/tor-connect/tor-connect.rc -o cmd/tor-connect/resource_windows_amd64.syso
          ls -l cmd/tor-connect/*.syso

      - name: Build tor-connect (cgo, single process)
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: |
          TORSRC="$(echo "$PWD"/build/src/tor-*)"
          LIBS="$(find "$TORSRC/src" -name '*.a' | sort | tr '\n' ' ')"
          export CGO_CFLAGS="-O2 -D_WIN32_WINNT=0x0601 -I$TORSRC/src/feature/api -I$PWD/build/prefix/include"
          export CGO_LDFLAGS="-L$PWD/build/prefix/lib -Wl,--start-group $LIBS -levent -lssl -lcrypto -lz -Wl,--end-group -lws2_32 -liphlpapi -lcrypt32 -lgdi32 -ladvapi32 -luser32 -lbcrypt -lshlwapi -static"
          mkdir -p dist
          { echo "CGO_CFLAGS=$CGO_CFLAGS"; echo "LIBS=$LIBS"; } > build/go-build.log
          set +e
          go build -trimpath -ldflags="-s -w" -o dist/tor-connect-win64.exe ./cmd/tor-connect >> build/go-build.log 2>&1
          rc=$?
          set -e
          cat build/go-build.log
          if [ "$rc" -ne 0 ]; then bash scripts/annotate.sh "go build failed (rc=$rc)" build/go-build.log; exit "$rc"; fi
          ls -l dist

      - name: Win7 sanity (imported DLLs, no UCRT)
        run: |
          x86_64-w64-mingw32-objdump -p dist/tor-connect-win64.exe | grep "DLL Name" | sort -u | tee dist/imports.txt
          if grep -Ei 'api-ms-win-crt|ucrtbase' dist/imports.txt; then echo "ОШИБКА: бинарник требует UCRT (не запустится на голой Win7)"; exit 1; fi
          ( cd dist && sha256sum tor-connect-win64.exe > SHA256SUMS && cat SHA256SUMS )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tor-connect-win64
          path: dist/
          if-no-files-found: error

      - name: Publish build info
        run: |
          {
            echo "size: $(stat -c %s dist/tor-connect-win64.exe) bytes"
            cat dist/SHA256SUMS
            echo "resource section (.rsrc) present: $(x86_64-w64-mingw32-objdump -h dist/tor-connect-win64.exe | grep -c '\.rsrc')"
            echo "imported DLLs:"; cat dist/imports.txt
          } > build/info.txt
          body="$(cat build/info.txt)"
          body="${body//'%'/'%25'}"; body="${body//$'\n'/'%0A'}"
          echo "::notice title=tor-connect build info::${body}"

      - name: Publish pre-release (dev-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete probe-latest --yes --cleanup-tag || true
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest dist/tor-connect-win64.exe dist/SHA256SUMS dist/imports.txt \
            --prerelease --target "$GITHUB_SHA" \
            --title "tor-connect (последняя сборка, Windows x64)" \
            --notes "Экспериментальная сборка: Tor внутри одного процесса, Windows 7+ x64. Коммит $GITHUB_SHA."
