name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Go 1.20 — та же версия, что и в сборке для Windows 7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.20.14"
          cache: false
      - name: Vet and test (pure Go packages)
        run: |
          go vet ./internal/...
          go test -race -count=1 ./internal/...
